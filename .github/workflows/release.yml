name: Windows 测试构建

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number；0 = 用 commit 数"
        required: false
        default: "0"
        type: string

permissions:
  contents: read

jobs:
  win_x64:
    name: Windows x64 (test)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Set version + pili_release.json
        shell: pwsh
        env:
          BUILD_NUMBER_OVERRIDE: ${{ inputs.build_number }}
        run: lib/scripts/build.ps1

      - name: Apply Windows patches
        shell: pwsh
        run: lib/scripts/patch.ps1 windows

      - name: media_kit native D3D11 renderer
        shell: pwsh
        run: lib/scripts/media_kit_windows_d3d11.ps1

      - name: Flutter pub get
        shell: pwsh
        run: flutter pub get

      - name: Build Windows (release)
        shell: pwsh
        run: >
          flutter build windows --release
          --dart-define-from-file=pili_release.json

      - name: Package zip
        shell: pwsh
        run: |
          $out = "PiliBro_windows_${{ env.version }}_x64_portable"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Recurse -Force "build/windows/x64/runner/Release/*" $out/
          Compress-Archive -Path "$out/*" -DestinationPath "$out.zip" -Force
          Get-Item "$out.zip" | Format-List Name, Length, FullName

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-test
          path: PiliBro_windows_*_x64_portable.zip
          if-no-files-found: error
          retention-days: 7
